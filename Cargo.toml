[workspace]
resolver = "3"
members = ["crates/catalog", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
ureq = "3"
jsonschema = { version = "0.30", default-features = false }
zstd = "0.13"
serde_yaml = "0.9"
tierbridge-catalog = { path = "crates/catalog" }

[workspace.lints.rust]
unsafe_code = "forbid"
